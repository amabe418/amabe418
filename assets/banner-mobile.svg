<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-label="Hi, I'm Amalia. Software Engineer in Havana, Cuba. Backend, AI and ML, Optimization.">
  <title>Hi, I'm Amalia</title>
  <defs>
    <clipPath id="card"><rect width="480" height="300" rx="16"/></clipPath>
    <clipPath id="typing">
      <rect x="64" y="168" width="352" height="34">
        <animate attributeName="width" values="0;352;352;0" keyTimes="0;0.45;0.85;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="480" height="300" fill="#131a2b"/>
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-160 0" dur="6s" repeatCount="indefinite"/>
      <path d="M0 252 Q40 222 80 252 T160 252 T240 252 T320 252 T400 252 T480 252 T560 252 T640 252 V300 H0 Z" fill="#a78bfa" fill-opacity="0.18"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" from="-160 0" to="0 0" dur="9s" repeatCount="indefinite"/>
      <path d="M0 266 Q40 244 80 266 T160 266 T240 266 T320 266 T400 266 T480 266 T560 266 T640 266 V300 H0 Z" fill="#a78bfa" fill-opacity="0.28"/>
    </g>
    <text x="240" y="98" text-anchor="middle" fill="#e6edf3" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1">Hi, I'm Amalia</text>
    <text x="240" y="138" text-anchor="middle" fill="#c9d1d9" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="600">Software Engineer · Havana, Cuba</text>
    <g clip-path="url(#typing)">
      <text x="240" y="192" text-anchor="middle" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="18">Backend · AI &amp; ML · Optimization</text>
    </g>
    <rect x="416" y="175" width="2" height="22" fill="#a78bfa">
      <animate attributeName="x" values="64;416;416;64" keyTimes="0;0.45;0.85;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
