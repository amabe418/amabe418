<svg xmlns="http://www.w3.org/2000/svg" width="400" height="110" viewBox="0 0 400 110" role="img" aria-label="Animated message passing between agents"><title>CocktailAssistant</title><rect width="400" height="110" rx="10" fill="#0b0f17"/>
<g stroke="#30363d" stroke-width="1.5"><line x1="50" y1="55" x2="150" y2="28"/><line x1="50" y1="55" x2="150" y2="82"/><line x1="150" y1="28" x2="250" y2="55"/><line x1="150" y1="82" x2="250" y2="55"/><line x1="250" y1="55" x2="350" y2="55"/></g>
<g fill="#e6edf3"><circle cx="50" cy="55" r="8"/><circle cx="150" cy="28" r="8"/><circle cx="150" cy="82" r="8"/><circle cx="250" cy="55" r="8"/></g>
<circle cx="350" cy="55" r="9" fill="#a78bfa"><animate attributeName="r" values="9;13;9" dur="2.4s" repeatCount="indefinite"/></circle>
<circle r="5" fill="#a78bfa"><animateMotion dur="2.4s" repeatCount="indefinite" path="M50 55 L150 28 L250 55 L350 55"/></circle>
<circle r="4" fill="#c4b5fd" opacity="0.7"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M50 55 L150 82 L250 55 L350 55"/></circle>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" fill="#8b949e"><text x="30" y="100">query</text><text x="225" y="100">retrieve</text><text x="330" y="100">answer</text></g>
</svg>
